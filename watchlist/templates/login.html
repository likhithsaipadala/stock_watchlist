{% extends "base.html" %}
{% block content %}
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: linear-gradient(135deg, #a445b2, #ff89e9);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .login-container {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    width: 100%;
    max-width: 400px;
    text-align: center;
    color: #fff;
  }

  .brand-text {
    font-size: 32px;
    font-weight: bold;
    color: #00ffc8;
  }

  .login-container h2 {
    margin-top: 10px;
    margin-bottom: 30px;
    font-size: 20px;
    color: #fff;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  .btn-login {
    background: linear-gradient(to right, #b06ab3, #4568dc);
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 14px;
    width: 100%;
    font-size: 16px;
    cursor: pointer;
  }

  .extra {
    margin-top: 16px;
    font-size: 14px;
  }

  .extra a {
    color: #00ffc8;
    font-weight: bold;
  }

  .footer {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #eee;
    font-size: 14px;
  }
</style>

<div class="login-container">
  <h1 class="brand-text">StockSage</h1>
  <h2>Welcome Back!</h2>

  <form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn-login">Login</button>
  </form>

  <div class="extra">
    Don’t have an account? <a href="{% url 'signup' %}">Sign up</a>
  </div>
</div>

<div class="footer">© StockSage. Predict smart. Invest wiser.</div>
{% endblock %}
