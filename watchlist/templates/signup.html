{% extends "base.html" %}
{% block content %}
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .signup-container {
    background: rgba(255, 255, 255, 0.05);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 400px;
    text-align: center;
    color: #fff;
  }

  .brand-text {
    font-size: 32px;
    font-weight: bold;
    color: #00ffc8;
  }

  .signup-container h2 {
    margin-top: 10px;
    margin-bottom: 30px;
    font-size: 20px;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  .btn-signup {
    background: linear-gradient(to right, #8e2de2, #4a00e0);
    color: white;
    font-weight: bold;
    font-size: 16px;
    padding: 14px;
    width: 100%;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .extra {
    margin-top: 16px;
    font-size: 14px;
  }

  .extra a {
    color: #00ffc8;
    font-weight: bold;
  }

  .footer {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #eee;
    font-size: 14px;
  }
</style>

<div class="signup-container">
  <h1 class="brand-text">StockSage</h1>
  <h2>Create your account</h2>

  <form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password1" placeholder="Password" required>
    <input type="password" name="password2" placeholder="Confirm Password" required>
    <button type="submit" class="btn-signup">Sign Up</button>
  </form>

  <div class="extra">
    Already have an account? <a href="{% url 'login' %}">Login</a>
  </div>
</div>

<div class="footer">© StockSage. Predict smart. Invest wiser.</div>
{% endblock %}
