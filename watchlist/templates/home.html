<!DOCTYPE html>
<html>
<head>
  <title>My Stock Watchlist</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h1 class="text-center mb-4">📈 My Stock Watchlist</h1>
    <a href="{% url 'logout' %}" class="btn btn-outline-secondary">Logout</a>
  </div>

    <!-- Add Stock Form -->
    <div class="card p-3 mb-4 shadow-sm">
      <h4 class="mb-3">Add a New Stock</h4>
      <form method="post">
        {% csrf_token %}
        <div class="input-group">
          {{ form.name }}
          <button type="submit" class="btn btn-success">Add</button>
        </div>
      </form>
    </div>

    <!-- Stock List -->
    {% for stock in stock_data %}
      <div class="card mb-3 shadow-sm">
        <div class="card-body">
          <h5 class="card-title d-flex justify-content-between align-items-center">
            <span>
              {{ stock.name }} — ₹{{ stock.price }}
              {% if stock.change_percent != "N/A" %}
                <span style="color: {% if stock.change_percent > 0 %}green{% else %}red{% endif %}; font-weight: bold;">
                  ({{ stock.change_percent }}%)
                </span>
              {% endif %}
            </span>

            <!-- Delete Button -->
            <form method="post" action="{% url 'delete_stock' stock.id %}" style="display:inline;">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </h5>

          {% if stock.chart %}
            <div id="chart-{{ forloop.counter0 }}" class="mt-3"></div>
            <script>
              Plotly.newPlot("chart-{{ forloop.counter0 }}", {{ stock.chart|safe }});
            </script>
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>

</body>
</html>
